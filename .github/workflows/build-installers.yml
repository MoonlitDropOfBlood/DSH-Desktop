name: Build Installers

# 手动触发（workflow_dispatch）或打 v* 标签时触发，构建并自动发布到 GitHub Releases。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 repo/contents:write 权限）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x64 + x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build + publish NSIS (x64 + ia32)
        run: npx electron-builder --win nsis --x64 --ia32 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe

  build-linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build + publish AppImage + deb + rpm
        run: npx electron-builder --linux --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac 上构建 x64；Apple Silicon 上构建 arm64。
          # （dmg 只能在 macOS 上构建；各自 arch 的 dmg 分别产出）
          - arch: x64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build + publish dmg (${{ matrix.arch }})
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-dmg
          path: dist/*.dmg
