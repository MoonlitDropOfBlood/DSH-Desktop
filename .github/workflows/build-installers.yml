name: Build Installers

# 手动触发（workflow_dispatch）只构建 + 上传 artifact；
# 打 v* 标签时（如 v1.0.0）额外把所有平台产物发布为一个正式 GitHub Release。
# 发布直接用内置 GITHUB_TOKEN（本文件顶部的 permissions: contents: write 已授权
# 创建/编辑 Release 与上传资产），不需要任何仓库 secret（2026-09-18 v1.10.0 事故：
# 原用 secrets.GH_TOKEN 个人 PAT，未配置/失效时 gh 报 401 Bad credentials，Release 发不出去）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一 ref 的重复触发排队执行（发版构建不取消，后到的等先到的完成），
# 防止 tag 连发时的并行构建与 Release 竞争。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch bundled pnpm
        run: node scripts/fetch-pnpm.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled plugin market
        run: node scripts/fetch-market-plugin.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled Node
        run: node scripts/fetch-node.js
      - name: Build NSIS (x64)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch bundled pnpm
        run: node scripts/fetch-pnpm.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled plugin market
        run: node scripts/fetch-market-plugin.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled Node
        run: node scripts/fetch-node.js
      - name: Build AppImage + deb + rpm
        run: npx electron-builder --linux --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch bundled pnpm
        run: node scripts/fetch-pnpm.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled plugin market
        run: node scripts/fetch-market-plugin.js
        env:
          DSH_DESKTOP_NPM_REGISTRY: "https://registry.npmjs.org"
      - name: Fetch bundled Node
        run: node scripts/fetch-node.js
        env:
          DSH_DESKTOP_NODE_ARCH: ${{ matrix.arch }}
      - name: Build dmg (${{ matrix.arch }})
        # GitHub 的 macos-14 runner 是 Apple Silicon；electron-builder 可在其上
        # 交叉构建 x64 与 arm64 的 dmg（macos-13/Intel runner 已被 GitHub 弃用）。
        #
        # 代码签名 + 公证（推荐，让 mac 用户双击即可打开、不再提示"已损坏/未验证"）：
        #   1. 需要一个付费的 Apple Developer 账号；
        #   2. 在 Keychain 生成 "Developer ID Application" 证书，导出为 .p12；
        #   3. 在仓库 Settings → Secrets 里配置：
        #      - CSC_LINK            = .p12 证书的 base64 或路径
        #      - CSC_KEY_PASSWORD    = .p12 密码
        #      - APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
        #        （或 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER）
        #   4. 以上 Secrets 全部配好后，本 step 会自动签名并 notarytool 公证。
        #      注意：签名凭据与公证凭据要么都配、要么都不配，只配一半会构建失败。
        #
        # 也可以不买账号、用"自制（自签名）证书"签名（scripts/mac-sign.js 兜底之外的选择）：
        #   - 在 Windows 上 `New-SelfSignedCertificate -Type CodeSigningCert` 生成并导出 .p12，
        #     把 base64 配到 CSC_LINK、密码配到 CSC_KEY_PASSWORD、证书名配到 CSC_NAME。
        #   - 自签名证书只能在"安装了该证书并信任它"的 Mac 上免提示打开；其他用户仍是
        #     "无法验证开发者"（右键→打开）。要在所有 Mac 上免提示，仍需要付费 Developer ID + 公证。
        # 未配置 Secrets 时：mac 包会走 scripts/mac-sign.js 的 ad-hoc 自签名兜底
        # （"已损坏" → "无法验证开发者"）。
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # --- 代码签名（Developer ID 或自制自签名证书均可，证书文件不要提交到仓库）---
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          # --- 公证（方式一：Apple ID + 专用密码）---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- 公证（方式二：App Store Connect API Key，与方式一选一）---
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-dmg
          retention-days: 14
          path: dist/*.dmg

  # 单独发布：把所有平台产物合成一个正式 Release（只对 v* 标签触发，避免生成 draft）。
  # Release 说明取自 CHANGELOG.md 中 "## [<版本号>]" 一节（打标签前先写好该节）。
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract CHANGELOG section for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const esc = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            // Capture the whole "## [<version>]" section (heading + change list),
            // stopping right before the NEXT "## [" heading or the end of the file.
            // NOTE: no "m" flag on purpose — with the multiline flag the lazy
            // [\s\S]*? would stop at $ (end-of-line) right after the heading, so
            // the release body would only contain the "version + date" line.
            const re = new RegExp("## \\[" + esc + "\\][\\s\\S]*?(?=\\n## \\[|$)", "");
            const m = text.match(re);
            fs.writeFileSync("RELEASE_BODY.md",
              (m ? m[0].trim() : "（CHANGELOG.md 中未找到 ## [" + version + "] 章节）") + "\n");
          ' "$VERSION"
      - name: List artifacts
        run: ls -la artifacts/
      # 发布 = 幂等创建 + 逐文件重试上传 + 完整性校验（gh CLI，替代 softprops/action-gh-release@v2）。
      #
      # 背景（v1.9.4/v1.9.5 连续踩坑）：softprops@v2 对 GitHub 资产上传接口（uploads.github.com）
      # 的抖动/超时没有兜底——新 Release 创建后有复制延迟（"not yet discoverable by tag"），
      # 大文件（dmg/exe 120-180MB）上传易超时（"Headers Timeout Error"，issue #549 的 5 分钟
      # 超时）或单资产失败（"Error saving asset"）；且单个资产失败不重试，一次失败整个 Release
      # 发布标红，留下半成品 Release 只能手动删。gh 逐文件独立请求 + 每文件最多 5 次重试 +
      # --clobber 幂等覆盖，最后校验全部产物在 Release 上才判成功，重跑/补传都安全。
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating it"
            # 重跑时保证 body 仍是本次 CHANGELOG 章节
            gh release edit "$TAG" --notes-file RELEASE_BODY.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_BODY.md
            echo "Created release $TAG"
          fi
      - name: Upload assets with per-file retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          fail=0
          for f in artifacts/*; do
            name="$(basename "$f")"
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "Uploaded $name"
                ok=1
                break
              fi
              echo "Upload of $name failed (attempt $i/5), retrying in 10s"
              sleep 10
            done
            [ "$ok" -eq 1 ] || { echo "Giving up on $name"; fail=1; }
          done
          [ "$fail" -eq 0 ]
      - name: Verify all assets are on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # GitHub normalizes uploaded asset names: SPACES → DOTS (the NSIS exe
          # "DeepSeek Harness Desktop Setup 1.10.0.exe" is stored as
          # "DeepSeek.Harness.Desktop.Setup.1.10.0.exe"). v1.10.0's verify step
          # compared RAW names, never matched, and failed after 5 attempts even
          # though all 8 assets were on the release. Compare NORMALIZED
          # (lowercased + space→dot) names on both sides.
          normalize() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr ' ' '.'; }
          stored() { gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null; }
          for attempt in 1 2 3 4 5; do
            missing=0
            assets="$(stored)"
            for f in artifacts/*; do
              name="$(basename "$f")"
              want="$(normalize "$name")"
              found=0
              while IFS= read -r s; do
                [ "$(normalize "$s")" = "$want" ] && { found=1; break; }
              done <<< "$assets"
              if [ "$found" -eq 0 ]; then
                echo "Waiting for $name to appear (attempt $attempt/5)"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] && { echo "All $(ls artifacts | wc -l) assets verified on $TAG"; exit 0; }
            sleep 15
          done
          echo "Release $TAG incomplete after verification retries"
          stored || true
          exit 1
