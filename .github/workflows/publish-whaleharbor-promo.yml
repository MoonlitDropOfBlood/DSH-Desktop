name: Publish whaleharbor-promo

# push 到 master 且 plugins/whaleharbor-promo/ 有变动时自动发布 npm：
# 对比 package.json 的版本号与 registry 上已发布的版本，只有新版本才 publish，
# 版本未变的重复 push 静默跳过。首次发布 / 补发用 workflow_dispatch 手动触发。
#
# 发布需要仓库 secret：NPM_TOKEN
#   npmjs.com →头像→ Access Tokens → Generate New Token (Classic) →
#   类型选 Automation（CI 中绕过 2FA）→ 复制 →
#   本仓库 Settings → Secrets and variables → Actions → New repository secret。
# 之后发新版本只改 plugins/whaleharbor-promo/package.json 的 version 再 push。
on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "plugins/whaleharbor-promo/**"
      - ".github/workflows/publish-whaleharbor-promo.yml"

permissions:
  contents: read
  id-token: write # npm publish --provenance 的 OIDC 签名要求

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/whaleharbor-promo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org" # 写入 .npmrc 的 authToken 指向
      - name: Resolve name@version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if version already on npm
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "already published: ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "new version: ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
          fi
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
